services:
  app:
    build:
      context: .
      dockerfile: ./.docker/Dockerfile
    container_name: go_web
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "${WEB_PORT}:8080"
    depends_on:
      - db

  db:
    image: postgres:16
    restart: always
    ports:
      - "${DATABASE_PORT}:5432"
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpassword
      POSTGRES_DB: link_shortener
      DATABASE_PORT: 5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dbuser -d link_shortener" ]
      interval: 10s
      retries: 5

volumes:
  pg_data:
